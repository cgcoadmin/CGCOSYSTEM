        :root {

            --secondary: #1E293B;
            --accent: #2563EB;
            --bg: #F8FAFC;
            --card-bg: #FFFFFF;
            --text-dark: #0F172A;
            --text-muted: #64748B;
            --border: #E2E8F0;
            --success: #059669;
            --shadow: 0 10px 15px -3px rgba(0, 0, 0, 0.1), 0 4px 6px -2px rgba(0, 0, 0, 0.05);

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Tajawal', sans-serif;
        }

        body {
            background-color: var(--bg);
            color: var(--text-dark);
            line-height: 1.6;
            padding-bottom: 50px;
        }

        /* الهيدر الرئيسي */
        header {
            background: linear-gradient(135deg, var(--secondary), var(--primary));
            color: white;
            padding: 30px 20px;
            text-align: center;
            box-shadow: var(--shadow);
        }

        header h1 {
            font-size: 1.8rem;
            font-weight: 800;
            margin-bottom: 8px;
        }

        header p {
            font-size: 1rem;
            opacity: 0.9;
        }

        /* الحاوية الرئيسية */
        .container {
            max-width: 1200px;
            margin: 30px auto;
            padding: 0 20px;
            display: grid;
            grid-template-columns: 320px 1fr;
            gap: 25px;
        }

        @media (max-width: 900px) {
            .container {
                grid-template-columns: 1fr;
            }
        }

        /* قائمة اختيار الأدوار (القائمة الجانبية) */

            background: var(--card-bg);
            border-radius: 16px;
            padding: 20px;
            border: 1px solid var(--border);
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.05);
            max-height: 800px;
            overflow-y: auto;
        }

        .sidebar h2 {
            font-size: 1.1rem;
            color: var(--primary);
            margin-bottom: 15px;
            padding-bottom: 8px;
            border-bottom: 2px solid var(--border);
        }

        .section-group {
            margin-bottom: 20px;
        }

        .section-title {
            font-size: 0.85rem;
            font-weight: 700;
            color: var(--text-muted);
            margin-bottom: 8px;
            text-transform: uppercase;
        }

        .role-btn {
            width: 100%;
            text-align: right;
            padding: 10px 14px;
            margin-bottom: 6px;
            background: #F1F5F9;
            border: 1px solid transparent;
            border-radius: 8px;
            font-weight: 500;
            font-size: 0.95rem;
            color: var(--secondary);
            cursor: pointer;
            transition: all 0.2s ease;
        }

        .role-btn:hover {
            background: #E2E8F0;
        }

        .role-btn.active {
            background: var(--primary);
            color: white;
            font-weight: 700;
            box-shadow: 0 4px 12px rgba(15, 76, 129, 0.25);
        }

        /* واجهة العمل الشخصية (Main Workspace) */
        .workspace {
            background: var(--card-bg);
            border-radius: 16px;
            padding: 30px;
            border: 1px solid var(--border);
            box-shadow: var(--shadow);
        }

        .role-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 2px solid var(--bg);
            padding-bottom: 20px;
            margin-bottom: 25px;
            flex-wrap: wrap;
            gap: 15px;
        }

        .role-title-group h2 {
            font-size: 1.6rem;
            color: var(--primary);
            font-weight: 800;
        }

        .role-title-group span {
            font-size: 0.95rem;
            color: var(--text-muted);
            font-weight: 500;
        }

        .badge {
            background: #EFF6FF;
            color: var(--accent);
            padding: 6px 14px;
            border-radius: 20px;
            font-size: 0.85rem;
            font-weight: 700;
            border: 1px solid #BFDBFE;
        }

        .goal-box {
            background: linear-gradient(to right, #F0F9FF, #E0F2FE);
            border-right: 4px solid var(--accent);
            padding: 18px 20px;
            border-radius: 8px;
            margin-bottom: 25px;
        }

        .goal-box h4 {
            color: var(--primary);
            margin-bottom: 5px;
            font-size: 1rem;
        }

        .goal-box p {
            color: #1E3A8A;
            font-size: 0.98rem;
        }

            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 20px;
            margin-bottom: 25px;
        }

                grid-template-columns: 1fr;
            }

        .card-block {
            background: #F8FAFC;
            border: 1px solid var(--border);
            border-radius: 12px;
            padding: 20px;

            font-size: 1.1rem;
            color: var(--secondary);
            margin-bottom: 12px;
            display: flex;
            align-items: center;
            gap: 8px;

            list-style-type: none;

            padding-right: 20px;
            margin-bottom: 10px;
            font-size: 0.95rem;
            color: var(--text-dark);

            right: 0;
            color: var(--accent);
            font-size: 1.3rem;
            line-height: 1;
        }

            background: #ECFDF5;
            border: 1px dashed var(--success);
            padding: 15px 20px;
            border-radius: 10px;
            text-align: center;
            font-weight: 700;
            color: #065F46;
            font-size: 1rem;

</head>

        // دالة عرض الواجهة الشخصية بناءً على رقم الدور المحجوز
        function loadRole(roleId) {
            // تحديث زر الاختيار النشط
            document.querySelectorAll('.role-btn').forEach(btn => btn.classList.remove('active'));
            event.target.classList.add('active');

            const role = rolesData[roleId];
            const workspace = document.getElementById('workspace');

            // إعداد عناصر المهام
            const tasksHtml = role.tasks.map(t => `<li>${t}</li>`).join('');
            const relsHtml = role.relations.map(r => `<li>${r}</li>`).join('');

            workspace.innerHTML = `
                <div class="role-header">
                    <div class="role-title-group">
                        <h2>${role.title}</h2>
                        <span>${role.enTitle}</span>
                    </div>
                    <div class="badge">${role.level}</div>
                </div>

                <div class="goal-box">
                    <h4>الهدف والغاية من الدور:</h4>
                    <p>${role.goal}</p>
                </div>

                <div class="grid-sections">
                    <div class="card-block">
                        <h3>📋 المسائل والمهام الرئيسية</h3>
                        <ul>${tasksHtml}</ul>
                    </div>

                    <div class="card-block">
                        <h3>🔗 خطوط الارتباط والتنسيق</h3>
                        <ul>${relsHtml}</ul>
                    </div>
                </div>

                <div class="rule-box">
                    💡 الخلاصة وقاعدة العمل: ${role.rule}
                </div>
            `;
        }

        // تحميل الدور الأول تلقائياً عند فتح الصفحة
        window.onload = function() {
            loadRole(1);
        };
    </script>
